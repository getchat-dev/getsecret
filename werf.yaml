project: burnotes
configVersion: 1

---
image: base-build-node
from: node:22-bookworm
imageSpec:
  config:
    workDir: /app
    env:
      TERM: xterm
shell:
  beforeInstall:
    - |
      set -e
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential python3 tzdata
      rm -f /etc/localtime
      ln -s /usr/share/zoneinfo/UTC /etc/localtime
      useradd --system --create-home --home-dir /home/burnotes --shell /usr/sbin/nologin --uid 10001 burnotes
      # Enable Corepack so `pnpm` resolves to the version pinned in
      # package.json's `packageManager` field. Bundled with Node since 16.9
      # but disabled by default; the activation is a one-shot.
      corepack enable
---
image: app
fromImage: base-build-node
imageSpec:
  config:
    user: burnotes
shell:
  install:
    - cd /app
    - pnpm install --frozen-lockfile
  setup:
    - cd /app
    - pnpm build
    # `pnpm prune --prod` walks the dep graph and removes anything reachable
    # only from devDependencies, mirroring `npm prune --omit=dev`.
    - pnpm prune --prod
    - chown -R burnotes:burnotes /app
git:
- add: /
  to: /app
  excludePaths:
  - .git
  - .env.example
  - .helm
  - .werf
  - .next
  - node_modules
  - werf.yaml
  - werf-giterminism.yaml
  - docker-compose.yml
  - docker-compose.dev.yml
  - docker-compose.infra.yml
  - .gitlab-ci.yml
  stageDependencies:
    install:
      - package.json
      - pnpm-lock.yaml
    setup:
      - src
      - public
      - next.config.ts
      - tsconfig.json
      - next-env.d.ts
