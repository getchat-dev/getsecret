project: burnotes
configVersion: 1

---
image: base-build-node
from: node:22-bookworm
docker:
  WORKDIR: /app
  ENV:
    TERM: xterm
shell:
  beforeInstall:
    - |
      set -e
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential python3 tzdata
      rm -f /etc/localtime
      ln -s /usr/share/zoneinfo/UTC /etc/localtime
      useradd --system --create-home --home-dir /home/burnotes --shell /usr/sbin/nologin --uid 10001 burnotes
---
image: app
fromImage: base-build-node
docker:
  USER: burnotes
shell:
  install:
    - cd /app
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
  setup:
    - cd /app
    - npm run build
    - npm prune --omit=dev
    - chown -R burnotes:burnotes /app
git:
- add: /
  to: /app
  excludePaths:
  - .git
  - .env.example
  - .helm
  - .werf
  - .next
  - node_modules
  - werf.yaml
  - werf-giterminism.yaml
  - docker-compose.yml
  - docker-compose.dev.yml
  - docker-compose.infra.yml
  - .gitlab-ci.yml
  stageDependencies:
    install:
      - package.json
      - package-lock.json
    setup:
      - src
      - public
      - next.config.ts
      - tsconfig.json
      - next-env.d.ts
