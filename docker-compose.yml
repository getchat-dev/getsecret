name: burnotes

networks:
  web:
    external: true
  infra:
    external: true
    name: burnotes-infra

services:
  app:
    image: $WERF_APP_DOCKER_IMAGE_NAME
    command: ["pnpm", "start"]
    init: true
    restart: unless-stopped
    env_file: .env
    expose:
      - "${APP_PORT}"
    # Resource ceiling so a runaway/injected workload cannot consume the host.
    # The Node.js heap is also clamped via NODE_OPTIONS; both must be honored.
    mem_limit: 512m
    pids_limit: 200
    cpus: 1.0
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
    # Container filesystem is read-only by default; the few paths the app
    # genuinely writes to are remounted as size-bounded tmpfs with noexec —
    # which means a dropped binary in /tmp or /var/tmp cannot be executed.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /var/tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /app/.next/cache:size=64m,mode=0755,noexec,nosuid,nodev
      # Generic cache dir for the runtime shim (corepack/pnpm writes state
      # here on first invocation). Used to be /.npm under npm; renamed to
      # /.cache so it survives any future package-manager change.
      - /home/burnotes/.cache:size=8m,mode=0755,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- --timeout=3 http://127.0.0.1:${APP_PORT}/robots.txt > /dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - web
      - infra
    labels:
      - traefik.enable=true
      - traefik.docker.network=web # <<< force Traefik to use the 'web' network

      # your app's internal port inside the container
      - traefik.http.services.burnotes.loadbalancer.server.port=${APP_PORT}

      # HTTPS router
      - traefik.http.routers.burnotes.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.burnotes.entrypoints=websecure
      - traefik.http.routers.burnotes.tls=true
      - traefik.http.routers.burnotes.tls.certresolver=le

      # HTTP router -> redirect to HTTPS
      - traefik.http.routers.burnotesinsecure.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.burnotesinsecure.entrypoints=web
      - traefik.http.routers.burnotesinsecure.middlewares=redirect-to-https

      # Redirect middleware
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true

      # Redirection from old domain to new domain
      - traefik.http.routers.burnotes-old.rule=Host(`${OLD_APP_HOST}`)
      - traefik.http.routers.burnotes-old.entrypoints=web,websecure
      - traefik.http.routers.burnotes-old.middlewares=redirect-to-new-domain
      - traefik.http.routers.burnotes-old.tls=true
      - traefik.http.routers.burnotes-old.tls.certresolver=le

      - traefik.http.middlewares.redirect-to-new-domain.redirectregex.regex=^https?://${OLD_APP_HOST}/?(.*)
      - traefik.http.middlewares.redirect-to-new-domain.redirectregex.replacement=https://${APP_HOST}/$${1}
      - traefik.http.middlewares.redirect-to-new-domain.redirectregex.permanent=true
